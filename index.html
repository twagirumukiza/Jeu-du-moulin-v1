<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Jeu du Moulin - Édition Avancée</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #d4af37;
            --accent-hover: #f39c12;
            --board-bg: #2a241e;
            --line-color: #8c7355;
            --node-color: #d4af37;
            --p1-color: #e74c3c;
            --p2-color: #3498db;
            --highlight: #2ecc71;
        }

        [data-theme="light"] {
            --bg-color: #f4f1ea;
            --surface-color: #ffffff;
            --text-color: #2c3e50;
            --accent-color: #8c6d36;
            --accent-hover: #b58d3d;
            --board-bg: #e6dfd1;
            --line-color: #594a38;
            --node-color: #594a38;
            --p1-color: #c0392b;
            --p2-color: #2980b9;
            --highlight: #27ae60;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background-color: var(--surface-color);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: var(--accent-color);
            text-align: center;
        }

        .screen {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
        }

        .screen.active {
            display: flex;
        }

        .menu-btn, .btn {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            padding: 12px 24px;
            margin: 8px 0;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            max-width: 280px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .menu-btn:hover, .btn:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
        }

        .settings-group {
            margin: 15px 0;
            width: 100%;
            max-width: 280px;
        }

        .settings-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .settings-group select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--line-color);
            background: var(--bg-color);
            color: var(--text-color);
            font-size: 1rem;
        }

        .hud {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 15px;
            font-size: 0.95rem;
            font-weight: bold;
        }

        .player-score {
            padding: 8px 12px;
            border-radius: 6px;
            background: var(--bg-color);
            border: 2px solid transparent;
        }

        .player-score.active {
            border-color: var(--accent-color);
        }

        .status-message {
            margin: 10px 0;
            font-size: 1rem;
            font-weight: 600;
            text-align: center;
            min-height: 24px;
            color: var(--accent-color);
        }

        .board-container {
            position: relative;
            width: 100%;
            max-width: 450px;
            aspect-ratio: 1;
            background-color: var(--board-bg);
            border-radius: 12px;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.2);
            margin-bottom: 15px;
        }

        svg {
            width: 100%;
            height: 100%;
        }

        .board-line {
            stroke: var(--line-color);
            stroke-width: 3;
            stroke-linecap: round;
        }

        .node {
            fill: var(--board-bg);
            stroke: var(--line-color);
            stroke-width: 3;
            cursor: pointer;
            transition: transform 0.2s, fill 0.2s;
        }

        .node:hover {
            transform: scale(1.2);
        }

        .node.highlight {
            stroke: var(--highlight);
            stroke-width: 4;
            animation: pulse 1.5s infinite;
        }

        .piece {
            cursor: pointer;
            transition: transform 0.2s;
        }

        .piece.p1 {
            fill: var(--p1-color);
        }

        .piece.p2 {
            fill: var(--p2-color);
        }

        .piece.selected {
            stroke: var(--highlight);
            stroke-width: 3;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        .controls-row {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 450px;
        }

        .controls-row button {
            flex: 1;
            max-width: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Le Jeu du Moulin</h1>

        <!-- MENU PRINCIPAL -->
        <div id="main-menu" class="screen active">
            <button class="menu-btn" onclick="playSound('click'); showScreen('mode-menu')">Jouer</button>
            <button class="menu-btn" onclick="playSound('click'); showScreen('settings-menu')">Paramètres</button>
        </div>

        <!-- MENU MODE DE JEU -->
        <div id="mode-menu" class="screen">
            <button class="menu-btn" onclick="playSound('click'); startGame('ai')">Solo contre l'IA</button>
            <button class="menu-btn" onclick="playSound('click'); startGame('local')">Deux joueurs (Local)</button>
            <button class="menu-btn" onclick="playSound('click'); startGame('multi')">Multijoueur (Simulé)</button>
            <button class="menu-btn" style="background:#555;" onclick="playSound('click'); showScreen('main-menu')">Retour</button>
        </div>

        <!-- MENU PARAMÈTRES -->
        <div id="settings-menu" class="screen">
            <div class="settings-group">
                <label for="setting-diff">Difficulté de l'IA</label>
                <select id="setting-diff" onchange="updateSetting('difficulty', this.value)">
                    <option value="easy">Facile</option>
                    <option value="medium" selected>Moyen</option>
                    <option value="hard">Difficile</option>
                </select>
            </div>

            <div class="settings-group">
                <label for="setting-variant">Variante du plateau</label>
                <select id="setting-variant" onchange="updateSetting('variant', this.value)">
                    <option value="standard" selected>Standard (9 pions, sans diagonales)</option>
                    <option value="diagonals">Diagonales & Point Central (12 pions)</option>
                </select>
            </div>

            <div class="settings-group">
                <label for="setting-theme">Thème visuel</label>
                <select id="setting-theme" onchange="updateSetting('theme', this.value)">
                    <option value="dark" selected>Sombre</option>
                    <option value="light">Clair</option>
                </select>
            </div>

            <div class="settings-group">
                <label for="setting-music">Musique / Sons</label>
                <select id="setting-music" onchange="updateSetting('music', this.value)">
                    <option value="on" selected>Activé</option>
                    <option value="off">Désactivé</option>
                </select>
            </div>

            <button class="menu-btn" style="margin-top: 20px;" onclick="playSound('click'); showScreen('main-menu')">Sauvegarder & Retour</button>
        </div>

        <!-- ÉCRAN DE JEU -->
        <div id="game-screen" class="screen">
            <div class="hud">
                <div id="hud-p1" class="player-score">Joueur 1: <span id="p1-reserve">9</span> en réserve | <span id="p1-board">0</span> sur plateau</div>
                <div id="hud-p2" class="player-score">Joueur 2: <span id="p2-reserve">9</span> en réserve | <span id="p2-board">0</span> sur plateau</div>
            </div>

            <div id="status-message" class="status-message">Phase 1 : Posez vos pions</div>

            <div class="board-container">
                <svg id="board-svg" viewBox="0 0 600 600" onclick="handleBoardClick(event)">
                    <!-- Généré dynamiquement par JS -->
                </svg>
            </div>

            <div class="controls-row">
                <button class="btn" style="background:#e74c3c;" onclick="playSound('click'); showScreen('main-menu')">Quitter</button>
                <button class="btn" onclick="playSound('click'); resetGame()">Recommencer</button>
            </div>
        </div>
    </div>

    <script>
        // --- SYSTÈME AUDIO (WEB AUDIO API) ---
        let audioCtx = null;
        function playSound(type) {
            if (settings.music !== 'on') return;
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;

                if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.04);
                    osc.start(now);
                    osc.stop(now + 0.04);
                } else if (type === 'place') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(250, now);
                    osc.frequency.exponentialRampToValueAtTime(480, now + 0.1);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                    osc.start(now);
                    osc.stop(now + 0.12);
                } else if (type === 'move') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(320, now);
                    osc.frequency.exponentialRampToValueAtTime(380, now + 0.08);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'mill') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.setValueAtTime(659.25, now + 0.08);
                    osc.frequency.setValueAtTime(783.99, now + 0.16);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                } else if (type === 'win') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.setValueAtTime(554.37, now + 0.12);
                    osc.frequency.setValueAtTime(659.25, now + 0.24);
                    osc.frequency.setValueAtTime(880, now + 0.36);
                    gain.gain.setValueAtTime(0.18, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                    osc.start(now);
                    osc.stop(now + 0.6);
                }
            } catch (e) {
                console.error(e);
            }
        }

        // --- CONFIGURATION ET ÉTAT ---
        const settings = {
            difficulty: 'medium',
            variant: 'standard',
            theme: 'dark',
            music: 'on'
        };

        let gameState = {
            mode: 'local',
            turn: 1,
            phase: 1,
            maxPieces: 9,
            p1Reserve: 9,
            p2Reserve: 9,
            p1OnBoard: 0,
            p2OnBoard: 0,
            selectedNode: null,
            removingPiece: false,
            board: [],
            gameOver: false
        };

        // Coordonnées des 25 nœuds (0 à 23 pour les 3 carrés, 24 pour le point central)
        const nodeCoords = [
            // Carré extérieur (0-7)
            {x: 50, y: 50},   {x: 300, y: 50},  {x: 550, y: 50},
            {x: 550, y: 300}, {x: 550, y: 550}, {x: 300, y: 550},
            {x: 50, y: 550},  {x: 50, y: 300},
            // Carré du milieu (8-15)
            {x: 125, y: 125}, {x: 300, y: 125}, {x: 475, y: 125},
            {x: 475, y: 300}, {x: 475, y: 475}, {x: 300, y: 475},
            {x: 125, y: 475}, {x: 125, y: 300},
            // Carré intérieur (16-23)
            {x: 200, y: 200}, {x: 300, y: 200}, {x: 400, y: 200},
            {x: 400, y: 300}, {x: 400, y: 400}, {x: 300, y: 400},
            {x: 200, y: 400}, {x: 200, y: 300},
            // Point Central (24)
            {x: 300, y: 300}
        ];

        // Connexions orthogonales de base
        const baseAdjacencies = {
            0: [1, 7], 1: [0, 2, 9], 2: [1, 3], 3: [2, 4, 11], 4: [3, 5], 5: [4, 6, 13], 6: [5, 7], 7: [0, 6, 15],
            8: [9, 15], 9: [8, 10, 1, 17], 10: [9, 11], 11: [10, 12, 3, 19], 12: [11, 13], 13: [12, 14, 5, 21], 14: [13, 15], 15: [8, 14, 7, 23],
            16: [17, 23], 17: [16, 18, 9], 18: [17, 19], 19: [18, 20, 11], 20: [19, 21], 21: [20, 22, 13], 22: [21, 23], 23: [16, 22, 15],
            24: [] // Rempli dynamiquement si variante active
        };

        const standardMills = [
            [0, 1, 2], [2, 3, 4], [4, 5, 6], [6, 7, 0],
            [8, 9, 10], [10, 11, 12], [12, 13, 14], [14, 15, 8],
            [16, 17, 18], [18, 19, 20], [20, 21, 22], [22, 23, 16],
            [1, 9, 17], [3, 11, 19], [5, 13, 21], [7, 15, 23]
        ];

        const diagonalMills = [
            [0, 8, 16], [4, 12, 20],
            [2, 10, 18], [6, 14, 22],
            [16, 24, 20], [18, 24, 22]
        ];

        function getActiveMills() {
            if (settings.variant === 'diagonals') {
                return [...standardMills, ...diagonalMills];
            }
            return standardMills;
        }

        function getAdjacencies() {
            let adj = JSON.parse(JSON.stringify(baseAdjacencies));
            if (settings.variant === 'diagonals') {
                // Diagonales extérieures et intermédiaires
                const diagPairs = [
                    [0, 8], [8, 16],
                    [2, 10], [10, 18],
                    [4, 12], [12, 20],
                    [6, 14], [14, 22]
                ];
                diagPairs.forEach(([a, b]) => {
                    if (!adj[a].includes(b)) adj[a].push(b);
                    if (!adj[b].includes(a)) adj[b].push(a);
                });
                // Connexions du point central (24) aux coins intérieurs (16, 18, 20, 22)
                adj[24] = [16, 18, 20, 22];
                [16, 18, 20, 22].forEach(n => {
                    if (!adj[n].includes(24)) adj[n].push(24);
                });
            }
            return adj;
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function updateSetting(key, value) {
            playSound('click');
            settings[key] = value;
            if (key === 'theme') {
                document.documentElement.setAttribute('data-theme', value);
            }
        }

        function startGame(mode) {
            gameState.mode = mode;
            gameState.maxPieces = (settings.variant === 'diagonals') ? 12 : 9;
            const numNodes = (settings.variant === 'diagonals') ? 25 : 24;
            
            gameState.p1Reserve = gameState.maxPieces;
            gameState.p2Reserve = gameState.maxPieces;
            gameState.p1OnBoard = 0;
            gameState.p2OnBoard = 0;
            gameState.board = Array(numNodes).fill(0);
            gameState.turn = 1;
            gameState.phase = 1;
            gameState.selectedNode = null;
            gameState.removingPiece = false;
            gameState.gameOver = false;

            showScreen('game-screen');
            renderBoard();
            updateHUD();
        }

        function resetGame() {
            startGame(gameState.mode);
        }

        function renderBoard() {
            const svg = document.getElementById('board-svg');
            let html = '';

            // Lignes standard orthogonales
            const lines = [
                [0,2], [2,4], [4,6], [6,0],
                [8,10], [10,12], [12,14], [14,8],
                [16,18], [18,20], [20,22], [22,16],
                [1,17], [3,19], [5,21], [7,23]
            ];

            lines.forEach(l => {
                html += `<line x1="${nodeCoords[l[0]].x}" y1="${nodeCoords[l[0]].y}" x2="${nodeCoords[l[1]].x}" y2="${nodeCoords[l[1]].y}" class="board-line" />`;
            });

            // Lignes diagonales et centre si variante active
            if (settings.variant === 'diagonals') {
                const diagLines = [
                    [0, 8], [8, 16],
                    [2, 10], [10, 18],
                    [4, 12], [12, 20],
                    [6, 14], [14, 22],
                    [16, 24], [20, 24],
                    [18, 24], [22, 24]
                ];
                diagLines.forEach(l => {
                    html += `<line x1="${nodeCoords[l[0]].x}" y1="${nodeCoords[l[0]].y}" x2="${nodeCoords[l[1]].x}" y2="${nodeCoords[l[1]].y}" class="board-line" stroke-dasharray="4,4" />`;
                });
            }

            // Rendu des nœuds et pions (0 à 23 ou 24)
            const numNodes = (settings.variant === 'diagonals') ? 25 : 24;
            for (let idx = 0; idx < numNodes; idx++) {
                const coord = nodeCoords[idx];
                let highlightClass = (gameState.selectedNode === idx) ? 'highlight' : '';

                html += `<circle cx="${coord.x}" cy="${coord.y}" r="13" class="node ${highlightClass}" data-index="${idx}" />`;

                if (gameState.board[idx] === 1) {
                    html += `<circle cx="${coord.x}" cy="${coord.y}" r="10" class="piece p1 ${gameState.selectedNode === idx ? 'selected' : ''}" data-index="${idx}" />`;
                } else if (gameState.board[idx] === 2) {
                    html += `<circle cx="${coord.x}" cy="${coord.y}" r="10" class="piece p2 ${gameState.selectedNode === idx ? 'selected' : ''}" data-index="${idx}" />`;
                }
            }

            svg.innerHTML = html;
        }

        function updateHUD() {
            document.getElementById('p1-reserve').innerText = gameState.p1Reserve;
            document.getElementById('p1-board').innerText = gameState.p1OnBoard;
            document.getElementById('p2-reserve').innerText = gameState.p2Reserve;
            document.getElementById('p2-board').innerText = gameState.p2OnBoard;

            document.getElementById('hud-p1').classList.toggle('active', gameState.turn === 1);
            document.getElementById('hud-p2').classList.toggle('active', gameState.turn === 2);

            const msg = document.getElementById('status-message');
            if (gameState.gameOver) return;

            if (gameState.removingPiece) {
                msg.innerText = `Joueur ${gameState.turn} : Retirez un pion adverse !`;
            } else if (gameState.phase === 1) {
                msg.innerText = `Phase 1 - Tour du Joueur ${gameState.turn} : Posez un pion`;
            } else {
                msg.innerText = `Phase 2 - Tour du Joueur ${gameState.turn} : Déplacez un pion`;
            }
        }

        function handleBoardClick(event) {
            if (gameState.gameOver) return;
            const target = event.target.closest('[data-index]');
            if (!target) return;
            const idx = parseInt(target.getAttribute('data-index'));

            if (gameState.removingPiece) {
                removePiece(idx);
                return;
            }

            if (gameState.phase === 1) {
                handlePhase1(idx);
            } else {
                handlePhase2(idx);
            }
        }

        function handlePhase1(idx) {
            const reserveKey = gameState.turn === 1 ? 'p1Reserve' : 'p2Reserve';
            const boardKey = gameState.turn === 1 ? 'p1OnBoard' : 'p2OnBoard';

            if (gameState.board[idx] === 0 && gameState[reserveKey] > 0) {
                gameState.board[idx] = gameState.turn;
                gameState[reserveKey]--;
                gameState[boardKey]++;
                playSound('place');

                if (checkMill(idx, gameState.turn)) {
                    gameState.removingPiece = true;
                    playSound('mill');
                } else {
                    nextTurn();
                }

                checkPhaseTransition();
                renderBoard();
                updateHUD();

                if (!gameState.gameOver && gameState.mode === 'ai' && gameState.turn === 2 && !gameState.removingPiece) {
                    setTimeout(aiTurn, 600);
                }
            }
        }

        function handlePhase2(idx) {
            const player = gameState.turn;
            const adj = getAdjacencies();
            const totalOnBoard = player === 1 ? gameState.p1OnBoard : gameState.p2OnBoard;
            const canFly = totalOnBoard === 3;

            if (gameState.selectedNode === null) {
                if (gameState.board[idx] === player) {
                    gameState.selectedNode = idx;
                    playSound('click');
                    renderBoard();
                }
            } else {
                if (gameState.board[idx] === 0) {
                    const isValidMove = canFly || adj[gameState.selectedNode].includes(idx);
                    if (isValidMove) {
                        gameState.board[gameState.selectedNode] = 0;
                        gameState.board[idx] = player;
                        gameState.selectedNode = null;
                        playSound('move');

                        if (checkMill(idx, player)) {
                            gameState.removingPiece = true;
                            playSound('mill');
                        } else {
                            nextTurn();
                        }

                        checkGameOver();
                        renderBoard();
                        updateHUD();

                        if (!gameState.gameOver && gameState.mode === 'ai' && gameState.turn === 2 && !gameState.removingPiece) {
                            setTimeout(aiTurn, 600);
                        }
                    } else {
                        gameState.selectedNode = null;
                        renderBoard();
                    }
                } else if (gameState.board[idx] === player) {
                    gameState.selectedNode = idx;
                    playSound('click');
                    renderBoard();
                } else {
                    gameState.selectedNode = null;
                    renderBoard();
                }
            }
        }

        function removePiece(idx) {
            const opponent = gameState.turn === 1 ? 2 : 1;
            if (gameState.board[idx] === opponent) {
                if (isInMill(idx, opponent) && !allPiecesInMill(opponent)) {
                    alert("Ce pion fait partie d'un moulin ! Choisissez-en un autre.");
                    return;
                }

                gameState.board[idx] = 0;
                if (opponent === 1) gameState.p1OnBoard--;
                else gameState.p2OnBoard--;

                gameState.removingPiece = false;
                playSound('click');
                checkGameOver();
                
                if (!gameState.gameOver) {
                    nextTurn();
                }

                renderBoard();
                updateHUD();

                if (!gameState.gameOver && gameState.mode === 'ai' && gameState.turn === 2) {
                    setTimeout(aiTurn, 600);
                }
            }
        }

        function checkMill(idx, player) {
            const activeMills = getActiveMills();
            return activeMills.some(mill => mill.includes(idx) && mill.every(i => gameState.board[i] === player));
        }

        function isInMill(idx, player) {
            const activeMills = getActiveMills();
            return activeMills.some(mill => mill.includes(idx) && mill.every(i => gameState.board[i] === player));
        }

        function allPiecesInMill(player) {
            const numNodes = (settings.variant === 'diagonals') ? 25 : 24;
            const playerIndices = [];
            for(let i=0; i<numNodes; i++) {
                if(gameState.board[i] === player) playerIndices.push(i);
            }
            return playerIndices.every(idx => isInMill(idx, player));
        }

        function checkPhaseTransition() {
            if (gameState.p1Reserve === 0 && gameState.p2Reserve === 0) {
                gameState.phase = 2;
            }
        }

        function nextTurn() {
            gameState.turn = gameState.turn === 1 ? 2 : 1;
        }

        function checkGameOver() {
            const p1Total = gameState.p1Reserve + gameState.p1OnBoard;
            const p2Total = gameState.p2Reserve + gameState.p2OnBoard;

            if (gameState.phase === 2) {
                if (p1Total < 3) { endGame(2); return; }
                if (p2Total < 3) { endGame(1); return; }
                if (isPlayerBlocked(1)) { endGame(2); return; }
                if (isPlayerBlocked(2)) { endGame(1); return; }
            }
        }

        function isPlayerBlocked(player) {
            if (player === 1 && gameState.p1Reserve > 0) return false;
            if (player === 2 && gameState.p2Reserve > 0) return false;
            const adj = getAdjacencies();
            const numNodes = (settings.variant === 'diagonals') ? 25 : 24;
            for (let i = 0; i < numNodes; i++) {
                if (gameState.board[i] === player) {
                    const totalOnBoard = player === 1 ? gameState.p1OnBoard : gameState.p2OnBoard;
                    if (totalOnBoard === 3) return false;
                    const hasMove = adj[i].some(neighbor => gameState.board[neighbor] === 0);
                    if (hasMove) return false;
                }
            }
            return true;
        }

        function endGame(winner) {
            gameState.gameOver = true;
            playSound('win');
            document.getElementById('status-message').innerText = `🎉 Le Joueur ${winner} a gagné la partie !`;
        }

        // --- INTELLIGENCE ARTIFICIELLE ---
        function aiTurn() {
            if (gameState.gameOver) return;

            if (gameState.removingPiece) {
                const numNodes = (settings.variant === 'diagonals') ? 25 : 24;
                const p1Pieces = [];
                for(let i=0; i<numNodes; i++) { if(gameState.board[i] === 1) p1Pieces.push(i); }
                const removable = p1Pieces.filter(i => !isInMill(i, 1) || allPiecesInMill(1));
                const target = removable.length > 0 ? removable[0] : p1Pieces[0];
                if (target !== undefined) removePiece(target);
                return;
            }

            if (gameState.phase === 1) {
                const numNodes = (settings.variant === 'diagonals') ? 25 : 24;
                const emptySpots = [];
                for(let i=0; i<numNodes; i++) { if(gameState.board[i] === 0) emptySpots.push(i); }
                if (emptySpots.length === 0) return;

                let chosenSpot = emptySpots[Math.floor(Math.random() * emptySpots.length)];
                if (settings.difficulty !== 'easy') {
                    for (let spot of emptySpots) {
                        gameState.board[spot] = 2;
                        if (checkMill(spot, 2)) {
                            gameState.board[spot] = 0;
                            chosenSpot = spot;
                            break;
                        }
                        gameState.board[spot] = 0;
                    }
                }

                gameState.board[chosenSpot] = 2;
                gameState.p2Reserve--;
                gameState.p2OnBoard++;
                playSound('place');

                if (checkMill(chosenSpot, 2)) {
                    gameState.removingPiece = true;
                    playSound('mill');
                } else {
                    nextTurn();
                }

                checkPhaseTransition();
                renderBoard();
                updateHUD();

                if (gameState.removingPiece) {
                    setTimeout(aiTurn, 600);
                }
            } else {
                const adj = getAdjacencies();
                const numNodes = (settings.variant === 'diagonals') ? 25 : 24;
                const aiPieces = [];
                for(let i=0; i<numNodes; i++) { if(gameState.board[i] === 2) aiPieces.push(i); }
                const canFly = gameState.p2OnBoard === 3;

                let possibleMoves = [];
                aiPieces.forEach(from => {
                    const destinations = canFly 
                        ? (() => { let emp=[]; for(let i=0; i<numNodes; i++) if(gameState.board[i]===0) emp.push(i); return emp; })()
                        : adj[from].filter(to => gameState.board[to] === 0);
                    
                    destinations.forEach(to => {
                        possibleMoves.push({ from, to });
                    });
                });

                if (possibleMoves.length === 0) return;

                let bestMove = possibleMoves[Math.floor(Math.random() * possibleMoves.length)];
                if (settings.difficulty !== 'easy') {
                    for (let move of possibleMoves) {
                        gameState.board[move.from] = 0;
                        gameState.board[move.to] = 2;
                        if (checkMill(move.to, 2)) {
                            gameState.board[move.from] = 2;
                            gameState.board[move.to] = 0;
                            bestMove = move;
                            break;
                        }
                        gameState.board[move.from] = 2;
                        gameState.board[move.to] = 0;
                    }
                }

                gameState.board[bestMove.from] = 0;
                gameState.board[bestMove.to] = 2;
                playSound('move');

                if (checkMill(bestMove.to, 2)) {
                    gameState.removingPiece = true;
                    playSound('mill');
                } else {
                    nextTurn();
                }

                checkGameOver();
                renderBoard();
                updateHUD();

                if (gameState.removingPiece && !gameState.gameOver) {
                    setTimeout(aiTurn, 600);
                }
            }
        }
    </script>
