<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Jeu du Moulin</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #d4af37;
            --accent-hover: #f39c12;
            --board-bg: #2a241e;
            --line-color: #8c7355;
            --node-color: #d4af37;
            --p1-color: #e74c3c;
            --p2-color: #3498db;
            --highlight: #2ecc71;
        }

        [data-theme="light"] {
            --bg-color: #f4f1ea;
            --surface-color: #ffffff;
            --text-color: #2c3e50;
            --accent-color: #8c6d36;
            --accent-hover: #b58d3d;
            --board-bg: #e6dfd1;
            --line-color: #594a38;
            --node-color: #594a38;
            --p1-color: #c0392b;
            --p2-color: #2980b9;
            --highlight: #27ae60;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background-color: var(--surface-color);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: var(--accent-color);
            text-align: center;
        }

        /* Screens */
        .screen {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
        }

        .screen.active {
            display: flex;
        }

        /* Menu Styling */
        .menu-btn, .btn {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            padding: 12px 24px;
            margin: 8px 0;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            max-width: 280px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .menu-btn:hover, .btn:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
        }

        /* Settings & Options */
        .settings-group {
            margin: 15px 0;
            width: 100%;
            max-width: 280px;
        }

        .settings-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .settings-group select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--line-color);
            background: var(--bg-color);
            color: var(--text-color);
            font-size: 1rem;
        }

        /* Game HUD */
        .hud {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 15px;
            font-size: 0.95rem;
            font-weight: bold;
        }

        .player-score {
            padding: 8px 12px;
            border-radius: 6px;
            background: var(--bg-color);
            border: 2px solid transparent;
        }

        .player-score.active {
            border-color: var(--accent-color);
        }

        .status-message {
            margin: 10px 0;
            font-size: 1rem;
            font-weight: 600;
            text-align: center;
            min-height: 24px;
            color: var(--accent-color);
        }

        /* Board Canvas/SVG */
        .board-container {
            position: relative;
            width: 100%;
            max-width: 450px;
            aspect-ratio: 1;
            background-color: var(--board-bg);
            border-radius: 12px;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.2);
            margin-bottom: 15px;
        }

        svg {
            width: 100%;
            height: 100%;
        }

        .board-line {
            stroke: var(--line-color);
            stroke-width: 3;
            stroke-linecap: round;
        }

        .node {
            fill: var(--board-bg);
            stroke: var(--line-color);
            stroke-width: 3;
            cursor: pointer;
            transition: transform 0.2s, fill 0.2s;
        }

        .node:hover {
            transform: scale(1.2);
        }

        .node.highlight {
            stroke: var(--highlight);
            stroke-width: 4;
            animation: pulse 1.5s infinite;
        }

        .piece {
            cursor: pointer;
            transition: transform 0.2s;
        }

        .piece.p1 {
            fill: var(--p1-color);
        }

        .piece.p2 {
            fill: var(--p2-color);
        }

        .piece.selected {
            stroke: var(--highlight);
            stroke-width: 3;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        .controls-row {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 450px;
        }

        .controls-row button {
            flex: 1;
            max-width: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Le Jeu du Moulin</h1>

        <!-- MENU PRINCIPAL -->
        <div id="main-menu" class="screen active">
            <button class="menu-btn" onclick="showScreen('mode-menu')">Jouer</button>
            <button class="menu-btn" onclick="showScreen('settings-menu')">Paramètres</button>
        </div>

        <!-- MENU MODE DE JEU -->
        <div id="mode-menu" class="screen">
            <button class="menu-btn" onclick="startGame('ai')">Solo contre l'IA</button>
            <button class="menu-btn" onclick="startGame('local')">Deux joueurs (Local)</button>
            <button class="menu-btn" onclick="startGame('multi')">Multijoueur (Simulé)</button>
            <button class="menu-btn" style="background:#555;" onclick="showScreen('main-menu')">Retour</button>
        </div>

        <!-- MENU PARAMÈTRES -->
        <div id="settings-menu" class="screen">
            <div class="settings-group">
                <label for="setting-diff">Difficulté de l'IA</label>
                <select id="setting-diff" onchange="updateSetting('difficulty', this.value)">
                    <option value="easy">Facile</option>
                    <option value="medium" selected>Moyen</option>
                    <option value="hard">Difficile</option>
                </select>
            </div>

            <div class="settings-group">
                <label for="setting-variant">Variante du plateau</label>
                <select id="setting-variant" onchange="updateSetting('variant', this.value)">
                    <option value="standard" selected>Sans diagonales (9 pions)</option>
                    <option value="diagonals">Avec diagonales (12 pions)</option>
                </select>
            </div>

            <div class="settings-group">
                <label for="setting-theme">Thème visuel</label>
                <select id="setting-theme" onchange="updateSetting('theme', this.value)">
                    <option value="dark" selected>Sombre</option>
                    <option value="light">Clair</option>
                </select>
            </div>

            <div class="settings-group">
                <label for="setting-music">Musique / Sons</label>
                <select id="setting-music" onchange="updateSetting('music', this.value)">
                    <option value="on" selected>Activé</option>
                    <option value="off">Désactivé</option>
                </select>
            </div>

            <button class="menu-btn" style="margin-top: 20px;" onclick="showScreen('main-menu')">Sauvegarder & Retour</button>
        </div>

        <!-- ÉCRAN DE JEU -->
        <div id="game-screen" class="screen">
            <div class="hud">
                <div id="hud-p1" class="player-score">Joueur 1: <span id="p1-reserve">9</span> en réserve | <span id="p1-board">0</span> sur plateau</div>
                <div id="hud-p2" class="player-score">Joueur 2: <span id="p2-reserve">9</span> en réserve | <span id="p2-board">0</span> sur plateau</div>
            </div>

            <div id="status-message" class="status-message">Phase 1 : Posez vos pions</div>

            <div class="board-container">
                <svg id="board-svg" viewBox="0 0 600 600" onclick="handleBoardClick(event)">
                    <!-- Les lignes et nœuds seront générés dynamiquement par JS -->
                </svg>
            </div>

            <div class="controls-row">
                <button class="btn" style="background:#e74c3c;" onclick="showScreen('main-menu')">Quitter</button>
                <button class="btn" onclick="resetGame()">Recommencer</button>
            </div>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ET ÉTAT DU JEU ---
        const settings = {
            difficulty: 'medium',
            variant: 'standard',
            theme: 'dark',
            music: 'on'
        };

        let gameState = {
            mode: 'local', // 'ai', 'local', 'multi'
            turn: 1, // 1 ou 2
            phase: 1, // 1: Placement, 2: Déplacement / Vol
            maxPieces: 9,
            p1Reserve: 9,
            p2Reserve: 9,
            p1OnBoard: 0,
            p2OnBoard: 0,
            selectedNode: null,
            removingPiece: false,
            board: Array(24).fill(0), // 0: vide, 1: J1, 2: J2
            gameOver: false
        };

        // --- DÉFINITION DES NŒUDS ET GRPAPHE (24 positions) ---
        // Coordonnées X, Y sur une grille 600x600
        const nodeCoords = [
            // Carré extérieur (0-7)
            {x: 50, y: 50},   {x: 300, y: 50},  {x: 550, y: 50},
            {x: 550, y: 300}, {x: 550, y: 550}, {x: 300, y: 550},
            {x: 50, y: 550},  {x: 50, y: 300},
            // Carré du milieu (8-15)
            {x: 125, y: 125}, {x: 300, y: 125}, {x: 475, y: 125},
            {x: 475, y: 300}, {x: 475, y: 475}, {x: 300, y: 475},
            {x: 125, y: 475}, {x: 125, y: 300},
            // Carré intérieur (16-23)
            {x: 200, y: 200}, {x: 300, y: 200}, {x: 400, y: 200},
            {x: 400, y: 300}, {x: 400, y: 400}, {x: 300, y: 400},
            {x: 200, y: 400}, {x: 200, y: 300}
        ];

        // Adjacences standards (orthogonales)
        const baseAdjacencies = {
            0: [1, 7], 1: [0, 2, 9], 2: [1, 3], 3: [2, 4, 11], 4: [3, 5], 5: [4, 6, 13], 6: [5, 7], 7: [0, 6, 15],
            8: [9, 15], 9: [8, 10, 1, 17], 10: [9, 11], 11: [10, 12, 3, 19], 12: [11, 13], 13: [12, 14, 5, 21], 14: [13, 15], 15: [8, 14, 7, 23],
            16: [17, 23], 17: [16, 18, 9], 18: [17, 19], 19: [18, 20, 11], 20: [19, 21], 21: [20, 22, 13], 22: [21, 23], 23: [16, 22, 15]
        };

        // Diagonales additionnelles (variante)
        const diagonalAdjacencies = {
            1: [17], 17: [1],
            3: [19], 19: [3],
            5: [21], 21: [5],
            7: [23], 23: [7]
        };

        // Moulins possibles (lignes de 3)
        const mills = [
            // Extérieur
            [0, 1, 2], [2, 3, 4], [4, 5, 6], [6, 7, 0],
            // Milieu
            [8, 9, 10], [10, 11, 12], [12, 13, 14], [14, 15, 8],
            // Intérieur
            [16, 17, 18], [18, 19, 20], [20, 21, 22], [22, 23, 16],
            // Connexions perpendiculaires
            [1, 9, 17], [3, 11, 19], [5, 13, 21], [7, 15, 23]
        ];

        // Ajout des moulins diagonaux si variante active
        const diagonalMills = [
            [0, 8, 16], [2, 10, 18], [4, 12, 20], [6, 14, 22]
        ];

        function getActiveMills() {
            if (settings.variant === 'diagonals') {
                return [...mills, ...diagonalMills];
            }
            return mills;
        }

        function getAdjacencies() {
            let adj = JSON.parse(JSON.stringify(baseAdjacencies));
            if (settings.variant === 'diagonals') {
                for (let k in diagonalAdjacencies) {
                    diagonalAdjacencies[k].forEach(target => {
                        if (!adj[k].includes(target)) adj[k].push(target);
                    });
                }
            }
            return adj;
        }

        // --- GESTION DES ÉCRANS ---
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function updateSetting(key, value) {
            settings[key] = value;
            if (key === 'theme') {
                document.documentElement.setAttribute('data-theme', value);
            }
        }

        // --- INITIALISATION DU JEU ---
        function startGame(mode) {
            gameState.mode = mode;
            gameState.maxPieces = (settings.variant === 'diagonals') ? 12 : 9;
            gameState.p1Reserve = gameState.maxPieces;
            gameState.p2Reserve = gameState.maxPieces;
            gameState.p1OnBoard = 0;
            gameState.p2OnBoard = 0;
            gameState.board = Array(24).fill(0);
            gameState.turn = 1;
            gameState.phase = 1;
            gameState.selectedNode = null;
            gameState.removingPiece = false;
            gameState.gameOver = false;

            showScreen('game-screen');
            renderBoard();
            updateHUD();
        }

        function resetGame() {
            startGame(gameState.mode);
        }

        // --- RENDU GRAPHIQUE SVG ---
        function renderBoard() {
            const svg = document.getElementById('board-svg');
            let html = '';

            // Lignes du plateau standard
            const lines = [
                [0,2], [2,4], [4,6], [6,0], // Extérieur
                [8,10], [10,12], [12,14], [14,8], // Milieu
                [16,18], [18,20], [20,22], [22,16], // Intérieur
                [1,17], [3,19], [5,21], [7,23] // Connexions
            ];

            lines.forEach(l => {
                html += `<line x1="${nodeCoords[l[0]].x}" y1="${nodeCoords[l[0]].y}" x2="${nodeCoords[l[1]].x}" y2="${nodeCoords[l[1]].y}" class="board-line" />`;
            });

            // Lignes diagonales si activées
            if (settings.variant === 'diagonals') {
                const diagLines = [[0,16], [2,18], [4,20], [6,22]];
                diagLines.forEach(l => {
                    html += `<line x1="${nodeCoords[l[0]].x}" y1="${nodeCoords[l[0]].y}" x2="${nodeCoords[l[1]].x}" y2="${nodeCoords[l[1]].y}" class="board-line" stroke-dasharray="5,5" />`;
                });
            }

            // Nœuds et pions
            nodeCoords.forEach((coord, idx) => {
                let highlightClass = '';
                if (gameState.selectedNode === idx) highlightClass = 'highlight';

                html += `<circle cx="${coord.x}" cy="${coord.y}" r="14" class="node ${highlightClass}" data-index="${idx}" />`;

                if (gameState.board[idx] === 1) {
                    html += `<circle cx="${coord.x}" cy="${coord.y}" r="11" class="piece p1 ${gameState.selectedNode === idx ? 'selected' : ''}" data-index="${idx}" />`;
                } else if (gameState.board[idx] === 2) {
                    html += `<circle cx="${coord.x}" cy="${coord.y}" r="11" class="piece p2 ${gameState.selectedNode === idx ? 'selected' : ''}" data-index="${idx}" />`;
                }
            });

            svg.innerHTML = html;
        }

        function updateHUD() {
            document.getElementById('p1-reserve').innerText = gameState.p1Reserve;
            document.getElementById('p1-board').innerText = gameState.p1OnBoard;
            document.getElementById('p2-reserve').innerText = gameState.p2Reserve;
            document.getElementById('p2-board').innerText = gameState.p2OnBoard;

            document.getElementById('hud-p1').classList.toggle('active', gameState.turn === 1);
            document.getElementById('hud-p2').classList.toggle('active', gameState.turn === 2);

            const msg = document.getElementById('status-message');
            if (gameState.gameOver) return;

            if (gameState.removingPiece) {
                msg.innerText = `Joueur ${gameState.turn} : Retirez un pion adverse !`;
            } else if (gameState.phase === 1) {
                msg.innerText = `Phase 1 - Tour du Joueur ${gameState.turn} : Posez un pion`;
            } else {
                msg.innerText = `Phase 2 - Tour du Joueur ${gameState.turn} : Déplacez un pion`;
            }
        }

        // --- LOGIQUE DE JEU ---
        function handleBoardClick(event) {
            if (gameState.gameOver) return;
            const target = event.target.closest('[data-index]');
            if (!target) return;
            const idx = parseInt(target.getAttribute('data-index'));

            if (gameState.removingPiece) {
                removePiece(idx);
                return;
            }

            if (gameState.phase === 1) {
                handlePhase1(idx);
            } else {
                handlePhase2(idx);
            }
        }

        function handlePhase1(idx) {
            const reserveKey = gameState.turn === 1 ? 'p1Reserve' : 'p2Reserve';
            const boardKey = gameState.turn === 1 ? 'p1OnBoard' : 'p2OnBoard';

            if (gameState.board[idx] === 0 && gameState[reserveKey] > 0) {
                gameState.board[idx] = gameState.turn;
                gameState[reserveKey]--;
                gameState[boardKey]++;

                if (checkMill(idx, gameState.turn)) {
                    gameState.removingPiece = true;
                } else {
                    nextTurn();
                }

                checkPhaseTransition();
                renderBoard();
                updateHUD();

                if (!gameState.gameOver && gameState.mode === 'ai' && gameState.turn === 2 && !gameState.removingPiece) {
                    setTimeout(aiTurn, 600);
                }
            }
        }

        function handlePhase2(idx) {
            const player = gameState.turn;
            const adj = getAdjacencies();
            const totalOnBoard = player === 1 ? gameState.p1OnBoard : gameState.p2OnBoard;
            const canFly = totalOnBoard === 3;

            if (gameState.selectedNode === null) {
                // Sélectionner son propre pion
                if (gameState.board[idx] === player) {
                    gameState.selectedNode = idx;
                    renderBoard();
                }
            } else {
                // Déplacer vers une case vide
                if (gameState.board[idx] === 0) {
                    const isValidMove = canFly || adj[gameState.selectedNode].includes(idx);
                    if (isValidMove) {
                        gameState.board[gameState.selectedNode] = 0;
                        gameState.board[idx] = player;
                        gameState.selectedNode = null;

                        if (checkMill(idx, player)) {
                            gameState.removingPiece = true;
                        } else {
                            nextTurn();
                        }

                        checkGameOver();
                        renderBoard();
                        updateHUD();

                        if (!gameState.gameOver && gameState.mode === 'ai' && gameState.turn === 2 && !gameState.removingPiece) {
                            setTimeout(aiTurn, 600);
                        }
                    } else {
                        gameState.selectedNode = null;
                        renderBoard();
                    }
                } else if (gameState.board[idx] === player) {
                    // Changer de sélection
                    gameState.selectedNode = idx;
                    renderBoard();
                } else {
                    gameState.selectedNode = null;
                    renderBoard();
                }
            }
        }

        function removePiece(idx) {
            const opponent = gameState.turn === 1 ? 2 : 1;
            if (gameState.board[idx] === opponent) {
                // Règle: Ne pas supprimer un pion faisant partie d'un moulin adverse sauf si tous le sont
                if (isInMill(idx, opponent) && !allPiecesInMill(opponent)) {
                    alert("Ce pion fait partie d'un moulin ! Choisissez-en un autre.");
                    return;
                }

                gameState.board[idx] = 0;
                if (opponent === 1) gameState.p1OnBoard--;
                else gameState.p2OnBoard--;

                gameState.removingPiece = false;
                checkGameOver();
                
                if (!gameState.gameOver) {
                    nextTurn();
                }

                renderBoard();
                updateHUD();

                if (!gameState.gameOver && gameState.mode === 'ai' && gameState.turn === 2) {
                    setTimeout(aiTurn, 600);
                }
            }
        }

        function checkMill(idx, player) {
            const activeMills = getActiveMills();
            return activeMills.some(mill => mill.includes(idx) && mill.every(i => gameState.board[i] === player));
        }

        function isInMill(idx, player) {
            const activeMills = getActiveMills();
            return activeMills.some(mill => mill.includes(idx) && mill.every(i => gameState.board[i] === player));
        }

        function allPiecesInMill(player) {
            const playerIndices = gameState.board.map((val, idx) => val === player ? idx : -1).filter(val => val !== -1);
            return playerIndices.every(idx => isInMill(idx, player));
        }

        function checkPhaseTransition() {
            if (gameState.p1Reserve === 0 && gameState.p2Reserve === 0) {
                gameState.phase = 2;
            }
        }

        function nextTurn() {
            gameState.turn = gameState.turn === 1 ? 2 : 1;
        }

        function checkGameOver() {
            const p1Total = gameState.p1Reserve + gameState.p1OnBoard;
            const p2Total = gameState.p2Reserve + gameState.p2OnBoard;

            if (gameState.phase === 2) {
                if (p1Total < 3) {
                    endGame(2);
                    return;
                }
                if (p2Total < 3) {
                    endGame(1);
                    return;
                }
                if (isPlayerBlocked(1)) {
                    endGame(2);
                    return;
                }
                if (isPlayerBlocked(2)) {
                    endGame(1);
                    return;
                }
            }
        }

        function isPlayerBlocked(player) {
            if (player === 1 && gameState.p1Reserve > 0) return false;
            if (player === 2 && gameState.p2Reserve > 0) return false;
            const adj = getAdjacencies();
            for (let i = 0; i < 24; i++) {
                if (gameState.board[i] === player) {
                    const totalOnBoard = player === 1 ? gameState.p1OnBoard : gameState.p2OnBoard;
                    if (totalOnBoard === 3) return false; // Peut voler
                    const hasMove = adj[i].some(neighbor => gameState.board[neighbor] === 0);
                    if (hasMove) return false;
                }
            }
            return true;
        }

        function endGame(winner) {
            gameState.gameOver = true;
            document.getElementById('status-message').innerText = `🎉 Le Joueur ${winner} a gagné la partie !`;
        }

        // --- INTELLIGENCE ARTIFICIELLE (IA) ---
        function aiTurn() {
            if (gameState.gameOver) return;

            if (gameState.removingPiece) {
                // Trouver un pion adverse à enlever
                const p1Pieces = gameState.board.map((v, i) => v === 1 ? i : -1).filter(i => i !== -1);
                const removable = p1Pieces.filter(i => !isInMill(i, 1) || allPiecesInMill(1));
                const target = removable.length > 0 ? removable[0] : p1Pieces[0];
                if (target !== undefined) removePiece(target);
                return;
            }

            if (gameState.phase === 1) {
                // Phase 1 : Poser un pion (IA)
                const emptySpots = gameState.board.map((v, i) => v === 0 ? i : -1).filter(i => i !== -1);
                if (emptySpots.length === 0) return;

                // Stratégie basique / intermédiaire / avancée
                let chosenSpot = emptySpots[Math.floor(Math.random() * emptySpots.length)];
                if (settings.difficulty !== 'easy') {
                    // Chercher à faire un moulin ou bloquer J1
                    for (let spot of emptySpots) {
                        gameState.board[spot] = 2;
                        if (checkMill(spot, 2)) {
                            gameState.board[spot] = 0;
                            chosenSpot = spot;
                            break;
                        }
                        gameState.board[spot] = 0;
                    }
                }

                gameState.board[chosenSpot] = 2;
                gameState.p2Reserve--;
                gameState.p2OnBoard++;

                if (checkMill(chosenSpot, 2)) {
                    gameState.removingPiece = true;
                } else {
                    nextTurn();
                }

                checkPhaseTransition();
                renderBoard();
                updateHUD();

                if (gameState.removingPiece) {
                    setTimeout(aiTurn, 600);
                }
            } else {
                // Phase 2 : Déplacer un pion (IA)
                const adj = getAdjacencies();
                const aiPieces = gameState.board.map((v, i) => v === 2 ? i : -1).filter(i => i !== -1);
                const canFly = gameState.p2OnBoard === 3;

                let possibleMoves = [];
                aiPieces.forEach(from => {
                    const destinations = canFly 
                        ? gameState.board.map((v, i) => v === 0 ? i : -1).filter(i => i !== -1)
                        : adj[from].filter(to => gameState.board[to] === 0);
                    
                    destinations.forEach(to => {
                        possibleMoves.push({ from, to });
                    });
                });

                if (possibleMoves.length === 0) return;

                // Choisir un mouvement (priorité aux moulins)
                let bestMove = possibleMoves[Math.floor(Math.random() * possibleMoves.length)];
                if (settings.difficulty !== 'easy') {
                    for (let move of possibleMoves) {
                        gameState.board[move.from] = 0;
                        gameState.board[move.to] = 2;
                        if (checkMill(move.to, 2)) {
                            gameState.board[move.from] = 2;
                            gameState.board[move.to] = 0;
                            bestMove = move;
                            break;
                        }
                        gameState.board[move.from] = 2;
                        gameState.board[move.to] = 0;
                    }
                }

                gameState.board[bestMove.from] = 0;
                gameState.board[bestMove.to] = 2;

                if (checkMill(bestMove.to, 2)) {
                    gameState.removingPiece = true;
                } else {
                    nextTurn();
                }

                checkGameOver();
                renderBoard();
                updateHUD();

                if (gameState.removingPiece && !gameState.gameOver) {
                    setTimeout(aiTurn, 600);
                }
            }
        }
    </script>
</body>
