<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeu du Moulin</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 { margin-bottom: 5px; color: #2c3e50; }
        #info {
            font-size: 1.2rem;
            margin: 15px 0;
            font-weight: bold;
            color: #e67e22;
        }
        #board-container {
            position: relative;
            width: 500px;
            height: 500px;
            margin: 0 auto;
            background-color: #d2b48c;
            border: 4px solid #8b4513;
            border-radius: 8px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }
        svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .node {
            position: absolute;
            width: 36px;
            height: 36px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background-color: #555;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s, transform 0.2s;
            z-index: 10;
        }
        .node:hover {
            transform: translate(-50%, -50%) scale(1.15);
            background-color: #777;
        }
        .node.p1 {
            background-color: #e74c3c;
            box-shadow: inset 0 0 6px rgba(0,0,0,0.4);
        }
        .node.p2 {
            background-color: #3498db;
            box-shadow: inset 0 0 6px rgba(0,0,0,0.4);
        }
        .node.selected {
            border: 3px solid #f1c40f;
        }
        #controls {
            margin-top: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 1rem;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button:hover { background-color: #219653; }
    </style>
</head>
<body>

    <h1>Jeu du Moulin</h1>
    <div id="info">Phase 1 : Placement des pions. Tour du Joueur 1 (Rouge)</div>

    <div id="board-container">
        <svg>
            <!-- Carré extérieur -->
            <rect x="50" y="50" width="400" height="400" stroke="#4a2511" stroke-width="4" fill="none"/>
            <!-- Carré médian -->
            <rect x="125" y="125" width="250" height="250" stroke="#4a2511" stroke-width="4" fill="none"/>
            <!-- Carré intérieur -->
            <rect x="200" y="200" width="100" height="100" stroke="#4a2511" stroke-width="4" fill="none"/>
            
            <!-- Lignes médianes -->
            <line x1="250" y1="50" x2="250" y2="200" stroke="#4a2511" stroke-width="4"/>
            <line x1="250" y1="300" x2="250" y2="450" stroke="#4a2511" stroke-width="4"/>
            <line x1="50" y1="250" x2="200" y2="250" stroke="#4a2511" stroke-width="4"/>
            <line x1="300" y1="250" x2="450" y2="250" stroke="#4a2511" stroke-width="4"/>
        </svg>
        
        <!-- Noeuds du plateau (24 positions) -->
        <!-- Extérieur -->
        <div class="node" style="top: 50px; left: 50px;" data-index="0"></div>
        <div class="node" style="top: 50px; left: 250px;" data-index="1"></div>
        <div class="node" style="top: 50px; left: 450px;" data-index="2"></div>
        <div class="node" style="top: 250px; left: 450px;" data-index="3"></div>
        <div class="node" style="top: 450px; left: 450px;" data-index="4"></div>
        <div class="node" style="top: 450px; left: 250px;" data-index="5"></div>
        <div class="node" style="top: 450px; left: 50px;" data-index="6"></div>
        <div class="node" style="top: 250px; left: 50px;" data-index="7"></div>

        <!-- Médian -->
        <div class="node" style="top: 125px; left: 125px;" data-index="8"></div>
        <div class="node" style="top: 125px; left: 250px;" data-index="9"></div>
        <div class="node" style="top: 125px; left: 375px;" data-index="10"></div>
        <div class="node" style="top: 250px; left: 375px;" data-index="11"></div>
        <div class="node" style="top: 375px; left: 375px;" data-index="12"></div>
        <div class="node" style="top: 375px; left: 250px;" data-index="13"></div>
        <div class="node" style="top: 375px; left: 125px;" data-index="14"></div>
        <div class="node" style="top: 250px; left: 125px;" data-index="15"></div>

        <!-- Intérieur -->
        <div class="node" style="top: 200px; left: 200px;" data-index="16"></div>
        <div class="node" style="top: 200px; left: 250px;" data-index="17"></div>
        <div class="node" style="top: 200px; left: 300px;" data-index="18"></div>
        <div class="node" style="top: 250px; left: 300px;" data-index="19"></div>
        <div class="node" style="top: 300px; left: 300px;" data-index="20"></div>
        <div class="node" style="top: 300px; left: 250px;" data-index="21"></div>
        <div class="node" style="top: 300px; left: 200px;" data-index="22"></div>
        <div class="node" style="top: 250px; left: 200px;" data-index="23"></div>
    </div>

    <div id="controls">
        <button onclick="resetGame()">Recommencer</button>
    </div>

    <script>
        const adjacencies = {
            0: [1, 7], 1: [0, 2, 9], 2: [1, 3], 3: [2, 4, 11], 4: [3, 5], 5: [4, 6, 13], 6: [5, 7], 7: [0, 6, 15],
            8: [9, 15], 9: [8, 10, 1], 10: [9, 11], 11: [10, 12, 3], 12: [11, 13], 13: [12, 14, 5], 14: [13, 15], 15: [14, 8, 7],
            16: [17, 23], 17: [16, 18, 9], 18: [17, 19], 19: [18, 20, 11], 20: [19, 21], 21: [20, 22, 13], 22: [21, 23], 23: [22, 16, 15]
        };

        const mills = [
            [0, 1, 2], [2, 3, 4], [4, 5, 6], [6, 7, 0], // Extérieur
            [8, 9, 10], [10, 11, 12], [12, 13, 14], [14, 15, 8], // Médian
            [16, 17, 18], [18, 19, 20], [20, 21, 22], [22, 23, 16], // Intérieur
            [1, 9, 17], [3, 11, 19], [5, 13, 21], [7, 15, 23] // Connexions
        ];

        let board = Array(24).fill(null);
        let currentPlayer = 1; // 1 ou 2
        let phase = 1; // 1: placement, 2: déplacement
        let piecesLeft = { 1: 9, 2: 9 };
        let selectedNode = null;
        let removingPiece = false;

        const infoDiv = document.getElementById('info');
        const nodes = document.querySelectorAll('.node');

        nodes.forEach(node => {
            node.addEventListener('click', () => {
                const index = parseInt(node.getAttribute('data-index'));
                handleCellClick(index);
            });
        });

        function handleCellClick(index) {
            if (removingPiece) {
                // Phase de suppression d'un pion adverse suite à un moulin
                let opponent = currentPlayer === 1 ? 2 : 1;
                if (board[index] === opponent) {
                    board[index] = null;
                    removingPiece = false;
                    
                    // Vérifier si l'adversaire a perdu (< 3 pions en phase 2)
                    if (phase === 2 && countPieces(opponent) < 3) {
                        infoDiv.innerText = `Le Joueur ${currentPlayer} a gagné !`;
                        lockGame();
                        return;
                    }
                    
                    switchPlayer();
                    updateDisplay();
                }
                return;
            }

            if (phase === 1) {
                if (board[index] === null) {
                    board[index] = currentPlayer;
                    piecesLeft[currentPlayer]--;

                    if (checkMill(index, currentPlayer)) {
                        removingPiece = true;
                        infoDiv.innerText = `Moulin ! Joueur ${currentPlayer}, retirez un pion adverse.`;
                        updateDisplay();
                        return;
                    }

                    if (piecesLeft[1] === 0 && piecesLeft[2] === 0) {
                        phase = 2;
                    }
                    switchPlayer();
                    updateDisplay();
                }
            } else if (phase === 2) {
                if (selectedNode === null) {
                    if (board[index] === currentPlayer) {
                        selectedNode = index;
                        updateDisplay();
                    }
                } else {
                    if (index === selectedNode) {
                        selectedNode = null;
                        updateDisplay();
                    } else if (board[index] === null && adjacencies[selectedNode].includes(index)) {
                        board[selectedNode] = null;
                        board[index] = currentPlayer;
                        
                        let movedIndex = index;
                        selectedNode = null;

                        if (checkMill(movedIndex, currentPlayer)) {
                            removingPiece = true;
                            infoDiv.innerText = `Moulin ! Joueur ${currentPlayer}, retirez un pion adverse.`;
                            updateDisplay();
                            return;
                        }

                        switchPlayer();
                        checkEndGame();
                        updateDisplay();
                    } else if (board[index] === currentPlayer) {
                        selectedNode = index;
                        updateDisplay();
                    }
                }
            }
        }

        function checkMill(index, player) {
            return mills.some(mill => {
                if (mill.includes(index)) {
                    return mill.every(i => board[i] === player);
                }
                return false;
            });
        }

        function switchPlayer() {
            currentPlayer = currentPlayer === 1 ? 2 : 1;
        }

        function countPieces(player) {
            return board.filter(p => p === player).length;
        }

        function checkEndGame() {
            if (phase === 2) {
                if (countPieces(1) < 3) {
                    infoDiv.innerText = "Le Joueur 2 a gagné !";
                    lockGame();
                } else if (countPieces(2) < 3) {
                    infoDiv.innerText = "Le Joueur 1 a gagné !";
                    lockGame();
                }
            }
        }

        function lockGame() {
            nodes.forEach(n => n.style.pointerEvents = 'none');
        }

        function updateDisplay() {
            nodes.forEach((node, index) => {
                node.className = 'node';
                if (board[index] === 1) node.classList.add('p1');
                if (board[index] === 2) node.classList.add('p2');
                if (index === selectedNode) node.classList.add('selected');
            });

            if (!removingPiece && !infoDiv.innerText.includes("gagné")) {
                let colorText = currentPlayer === 1 ? "Rouge" : "Bleu";
                if (phase === 1) {
                    infoDiv.innerText = `Phase 1 : Placement. Tour du Joueur ${currentPlayer} (${colorText}) - Pions restants : ${piecesLeft[currentPlayer]}`;
                } else {
                    infoDiv.innerText = `Phase 2 : Déplacement. Tour du Joueur ${currentPlayer} (${colorText})`;
                }
            }
        }

        function resetGame() {
            board = Array(24).fill(null);
            currentPlayer = 1;
            phase = 1;
            piecesLeft = { 1: 9, 2: 9 };
            selectedNode = null;
            removingPiece = false;
            nodes.forEach(n => n.style.pointerEvents = 'auto');
            updateDisplay();
        }

        updateDisplay();
    </script>
</body>
</html>
